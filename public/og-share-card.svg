<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF7ED"/>
      <stop offset="60%" stop-color="#FFEDD5"/>
      <stop offset="100%" stop-color="#FED7AA"/>
    </linearGradient>
    <linearGradient id="orangeG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EA580C"/>
      <stop offset="100%" stop-color="#F97316"/>
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#7C2D12" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgG)"/>
  
  <!-- Subtle playful floating shapes -->
  <circle cx="120" cy="100" r="70" fill="#FDE047" opacity="0.35"/>
  <circle cx="1080" cy="520" r="90" fill="#38BDF8" opacity="0.3"/>
  <circle cx="980" cy="90" r="50" fill="#F472B6" opacity="0.35"/>
  <circle cx="150" cy="530" r="60" fill="#4ADE80" opacity="0.3"/>

  <!-- Main Card Container -->
  <rect x="70" y="60" width="1060" height="510" rx="36" fill="#FFFFFF" stroke="#FDBA74" stroke-width="4" filter="url(#cardShadow)"/>

  <!-- Badge Top -->
  <rect x="120" y="105" width="460" height="42" rx="21" fill="#FFEDD5" stroke="#F97316" stroke-width="2"/>
  <text x="350" y="132" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="16" fill="#9A3412" text-anchor="middle" letter-spacing="1">
    🌟 PLATFORM DIGITAL PAUD RESMI TK DWP KEDANYANG
  </text>

  <!-- Title -->
  <text x="120" y="210" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="52" fill="#0F172A">
    SAKIRA DIGITAL
  </text>
  <text x="120" y="260" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="28" fill="#EA580C">
    Saku Kreatif Interaktif Ramah Anak
  </text>
  <text x="120" y="295" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="700" font-size="20" fill="#64748B" font-style="italic">
    "Growing with Knowledge" — Gresik, Jawa Timur
  </text>

  <!-- Features list with badges -->
  <g transform="translate(120, 335)">
    <!-- Item 1 -->
    <rect x="0" y="0" width="260" height="44" rx="14" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="2"/>
    <text x="18" y="28" font-size="16">📚</text>
    <text x="45" y="28" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="700" font-size="15" fill="#1E40AF">12 Materi Belajar & QR</text>

    <!-- Item 2 -->
    <rect x="275" y="0" width="240" height="44" rx="14" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="2"/>
    <text x="293" y="28" font-size="16">📋</text>
    <text x="320" y="28" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="700" font-size="15" fill="#065F46">Presensi & Rekap Siswa</text>

    <!-- Item 3 -->
    <rect x="0" y="56" width="260" height="44" rx="14" fill="#FDF2F8" stroke="#FBCFE8" stroke-width="2"/>
    <text x="18" y="84" font-size="16">🎨</text>
    <text x="45" y="84" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="700" font-size="15" fill="#9D174D">Portofolio Karya Anak</text>

    <!-- Item 4 -->
    <rect x="275" y="56" width="240" height="44" rx="14" fill="#FAF5FF" stroke="#E9D5FF" stroke-width="2"/>
    <text x="293" y="84" font-size="16">✨</text>
    <text x="320" y="84" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="700" font-size="15" fill="#6B21A8">Asisten SAKIRA AI</text>
  </g>

  <!-- Right Side Visual / Mascot Illustration -->
  <g transform="translate(800, 110)">
    <circle cx="160" cy="180" r="150" fill="#FEF3C7"/>
    <circle cx="160" cy="180" r="120" fill="#FDE047" stroke="#0F172A" stroke-width="8"/>
    
    <!-- Smiley child face -->
    <circle cx="125" cy="160" r="14" fill="#0F172A"/>
    <circle cx="195" cy="160" r="14" fill="#0F172A"/>
    <!-- Cheeks -->
    <circle cx="100" cy="190" r="16" fill="#F87171" opacity="0.8"/>
    <circle cx="220" cy="190" r="16" fill="#F87171" opacity="0.8"/>
    <!-- Big Smile -->
    <path d="M130 195 Q 160 235 190 195" fill="none" stroke="#0F172A" stroke-width="10" stroke-linecap="round"/>
    
    <!-- Graduation Cap / Hat -->
    <polygon points="160,30 85,90 235,90" fill="#2563EB" stroke="#0F172A" stroke-width="8" stroke-linejoin="round"/>
    <circle cx="160" cy="30" r="12" fill="#EF4444"/>

    <!-- Open book in hands -->
    <path d="M70 270 C 130 250, 150 265, 160 275 C 170 265, 190 250, 250 270 L 250 320 C 190 300, 170 315, 160 325 C 150 315, 130 300, 70 320 Z" fill="#FFFFFF" stroke="#0F172A" stroke-width="8" stroke-linejoin="round"/>
    <path d="M160 275 L 160 325" stroke="#0F172A" stroke-width="6"/>

    <!-- Pill tag -->
    <rect x="50" y="340" width="220" height="38" rx="19" fill="#0F172A"/>
    <text x="160" y="365" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="16" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">TK DWP KEDANYANG</text>
  </g>

  <!-- Footer link callout -->
  <rect x="120" y="480" width="515" height="42" rx="12" fill="#0F172A"/>
  <text x="140" y="507" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="15" fill="#FDE047">
    🔗 Buka & Bagikan Langsung:
  </text>
  <text x="350" y="507" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="600" font-size="14" fill="#FFFFFF">
    Mudah diakses di Smartphone & Tablet
  </text>
</svg>
